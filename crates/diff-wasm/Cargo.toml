[package]
name = "diff-wasm"
description = "WebAssembly bindings of diff-core for the web app"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
diff-core = { workspace = true, features = ["serde"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.129"
